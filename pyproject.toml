[project]
name = "thesis_work"
version = "0.0.1"
description = "Thesis Work"

# NOTE: Overwrites .python-version
requires-python = ">=3.11,<3.12"

authors = [
    {name = "İlker SIĞIRCI", email = "sigirci.ilker@gmail.com"},
]
maintainers = [
    {name = "İlker SIĞIRCI", email = "sigirci.ilker@gmail.com"},
]

keywords = [
    "thesis",
    "bioinformatics",
    "cheminformatics",
    "machine-learning",
    "deep-learning",
    "clustering",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "chemprop<2.0.0",
    "cudf-cu12>=25.2.2",
    "cugraph-cu12>=25.2.0",
    "cuml-cu12>=25.2.1",
    "dagster>=1.10.4",
    "datashader>=0.17.0",
    "deepchem>=2.8.0",
    "leidenalg>=0.10.2",
    "matplotlib>=3.10.1",
    "mols2grid>=2.0.0",
    "plotly>=6.0.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "simpletransformers>=0.70.1",
    "transformers>=4.49.0",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.0.1",
    "ruff==0.9.2",
    "rouge>=1.0.1",
    "jupyter>=1.0.0",
    "plotly>=5.22.0",
    "dagster-webserver>=1.10.4",
]
ui = [
    "ipython-genutils>=0.2.0", # NOTE: For stmol
    "stmol>=0.0.9",
    "py3dmol>=2.4.2",
    "streamlit>=1.43.1",
]

[tool.uv]
default-groups = ["dev", "ui"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
respect-gitignore = true

# extend-include = []

extend-exclude = [
    "bert-loves-chemistry",
    "molbert_repo",
    # "experiments",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
# "*.ipynb" = ["E501"]  # disable line-too-long in notebooks

[tool.ruff.format]
skip-magic-trailing-comma = false
# indent-style = "space"
# preview = true

[tool.ruff.lint]
allowed-confusables = ["ı", "’"]
select = [
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "C9",  # mccabe
    # "D",  # flake8-docstrings
    "E",  # pycodestyle errors (default)
    "F",  # pyflakes (default)
    "I",  # isort
    "PD", # pandas-vet
    "PIE", # pie
    # "PL",  # pylint
    # "PTH", # pathlib
    "Q",  # flake8-quotes
    "RET", # return
    "RUF", # Enable all ruff-specific checks
    "SIM", # simplify
    "S307", # eval
    # "T20",  # (disallow print statements) keep debugging statements out of the codebase
    "W",  # pycodestyle warnings
]

ignore = [
    "E501",  # Line too long, handled by ruff formatter
    "D107", # "Missing docstring in __init__",
]

exclude = ["*.ipynb"]

# unfixable = [
#     "F401" # Unused imports.
# ]

#extend-select = []

# [tool.ruff.lint.flake8-import-conventions.extend-aliases]
# some_alias = ""

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["wandb"]

[tool.dagster]
module_name = "dagster_pipelines"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
